<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban pessoal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kanban pessoal</h1>
      <p class="hint">Crie cartões, arraste entre colunas ou use as setas para mover.</p>
    </header>

    <button type="button" id="new-card" class="new-card-btn">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-plus"></use></svg>
      Novo cartão
    </button>

    <main id="board" class="board" aria-live="polite"></main>

    <template id="card-template">
      <article class="card" draggable="true">
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
        <div class="card-actions">
          <button type="button" data-action="left" title="Mover para a esquerda" aria-label="Mover para a esquerda">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-arrow-left"></use></svg>
          </button>
          <button type="button" data-action="right" title="Mover para a direita" aria-label="Mover para a direita">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-arrow-right"></use></svg>
          </button>
          <button type="button" data-action="edit" title="Editar">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-pencil"></use></svg>
            Editar
          </button>
          <button type="button" data-action="delete" class="danger" title="Apagar">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-trash"></use></svg>
            Apagar
          </button>
        </div>
      </article>
    </template>

    <dialog id="card-modal" class="card-modal" aria-labelledby="card-modal-title">
      <form id="card-form" autocomplete="off">
        <h2 id="card-modal-title">Novo cartão</h2>
        <label>
          Título
          <input id="card-title" name="title" type="text" maxlength="120" required />
        </label>
        <label>
          Descrição
          <textarea id="card-description" name="description" maxlength="500" rows="3"></textarea>
        </label>
        <label>
          Coluna
          <select id="card-status" name="status"></select>
        </label>
        <div class="modal-actions">
          <button type="button" id="card-cancel" class="ghost">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#ti-x"></use></svg>
            Cancelar
          </button>
          <button type="submit" id="card-save">Salvar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
