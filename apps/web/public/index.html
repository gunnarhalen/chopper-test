<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban pessoal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-text">
        <h1>Kanban pessoal</h1>
        <p class="hint">Crie cartões, arraste entre colunas ou use os botões de seta.</p>
      </div>
      <button type="button" id="new-card-btn" class="btn primary">
        <svg class="icon" aria-hidden="true" focusable="false">
          <use href="/icons/tabler-sprite.svg#tabler-plus"></use>
        </svg>
        Adicionar cartão
      </button>
    </header>

    <main id="board" class="board" aria-live="polite"></main>

    <template id="card-template">
      <article class="card" draggable="true">
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
        <div class="card-actions">
          <button
            type="button"
            data-action="left"
            class="icon-btn"
            title="Mover para a esquerda"
            aria-label="Mover para a esquerda"
          ></button>
          <button
            type="button"
            data-action="right"
            class="icon-btn"
            title="Mover para a direita"
            aria-label="Mover para a direita"
          ></button>
          <button type="button" data-action="edit"></button>
          <button type="button" data-action="delete" class="danger"></button>
        </div>
      </article>
    </template>

    <dialog id="card-modal" class="modal" aria-labelledby="card-modal-title">
      <form id="card-form" method="dialog" autocomplete="off">
        <header class="modal-header">
          <h2 id="card-modal-title">Novo cartão</h2>
          <button
            type="button"
            class="modal-close"
            data-action="close"
            title="Fechar"
            aria-label="Fechar"
          >
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="/icons/tabler-sprite.svg#tabler-x"></use>
            </svg>
          </button>
        </header>

        <label class="field">
          <span>Título</span>
          <input id="card-title" name="title" type="text" maxlength="120" required />
        </label>

        <label class="field">
          <span>Descrição</span>
          <input id="card-description" name="description" type="text" maxlength="500" />
        </label>

        <label class="field">
          <span>Coluna</span>
          <select id="card-status" name="status"></select>
        </label>

        <footer class="modal-footer">
          <button type="button" data-action="close">Cancelar</button>
          <button type="submit" class="primary">
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="/icons/tabler-sprite.svg#tabler-check"></use>
            </svg>
            Salvar
          </button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
