<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban pessoal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kanban pessoal</h1>
      <p class="hint">Crie cartões, arraste entre colunas ou use os botões ←/→.</p>
    </header>

    <div class="toolbar">
      <button id="open-card-modal" type="button" class="primary">+ Novo cartão</button>
    </div>

    <dialog id="card-modal" class="card-modal">
      <form id="card-form" autocomplete="off">
        <h2 id="card-modal-title">Novo cartão</h2>

        <label for="title">Título</label>
        <input
          id="title"
          name="title"
          type="text"
          placeholder="Título do cartão"
          maxlength="120"
          required
        />

        <label for="description">Descrição</label>
        <textarea
          id="description"
          name="description"
          placeholder="Descrição (opcional)"
          maxlength="500"
          rows="3"
        ></textarea>

        <label for="tags">Tags</label>
        <input
          id="tags"
          name="tags"
          type="text"
          placeholder="Separe por vírgula (ex.: urgente, estudo)"
        />

        <label for="comments">Comentários</label>
        <textarea
          id="comments"
          name="comments"
          placeholder="Um comentário por linha"
          rows="3"
        ></textarea>

        <label for="status">Coluna</label>
        <select id="status" name="status"></select>

        <menu class="card-modal-actions">
          <button type="button" data-action="cancel">Cancelar</button>
          <button type="submit" class="primary">Salvar</button>
        </menu>
      </form>
    </dialog>

    <main id="board" class="board" aria-live="polite"></main>

    <template id="card-template">
      <article class="card" draggable="true">
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
        <ul class="card-tags"></ul>
        <ul class="card-comments"></ul>
        <div class="card-actions">
          <button type="button" data-action="left" title="Mover para a esquerda">←</button>
          <button type="button" data-action="right" title="Mover para a direita">→</button>
          <button type="button" data-action="edit">Editar</button>
          <button type="button" data-action="delete" class="danger">Apagar</button>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
